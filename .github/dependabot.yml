# Weekly dependency updates as pull requests, so CI checks every upgrade.
# Minor and patch updates are grouped into one PR per ecosystem; major updates get their own.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the Go-based compiler) drops the JavaScript API that typescript-eslint
      # builds on, so typescript-eslint 8.x requires TypeScript <6.1 and npm ci fails with
      # ERESOLVE. Remove this once typescript-eslint supports TS 7:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
